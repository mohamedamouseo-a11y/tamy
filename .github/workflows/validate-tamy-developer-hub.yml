name: Validate Tamy Developer Hub

on:
  push:
    paths:
      - 'helpers/tamy_developer_hub.py'
      - 'helpers/tamy_developer_hub.py.dox.md'
      - 'api/tamy_developer_hub.py'
      - 'api/tamy_developer_hub.py.dox.md'
      - 'tests/test_tamy_developer_hub.py'
      - 'webui/components/settings/developer/developer-hub.html'
      - 'webui/components/settings/developer/developer-hub-store.js'
      - 'webui/components/settings/developer/developer-settings.html'
      - '.github/workflows/validate-tamy-developer-hub.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tamy
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest 'cryptography>=46.0.0'

      - name: Compile Developer Hub backend
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m py_compile helpers/tamy_developer_hub.py api/tamy_developer_hub.py 2>&1 | tee /tmp/devhub-compile.log

      - name: Run Developer Hub tests
        id: tests
        continue-on-error: true
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          pytest -q tests/test_tamy_developer_hub.py 2>&1 | tee /tmp/devhub-tests.log

      - name: Record validation result
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          VALIDATED_SHA: ${{ github.sha }}
        run: |
          mkdir -p .github/validation
          python - <<'PY'
          import json, os
          from pathlib import Path

          compile_outcome = os.environ.get('COMPILE_OUTCOME', 'unknown')
          test_outcome = os.environ.get('TEST_OUTCOME', 'unknown')
          status = 'success' if compile_outcome == 'success' and test_outcome == 'success' else 'failure'

          def tail(path):
              p = Path(path)
              if not p.is_file():
                  return ''
              return p.read_text(encoding='utf-8', errors='replace')[-4000:]

          payload = {
              'status': status,
              'validated_sha': os.environ.get('VALIDATED_SHA', ''),
              'compile': compile_outcome,
              'tests': test_outcome,
              'compile_log': tail('/tmp/devhub-compile.log'),
              'test_log': tail('/tmp/devhub-tests.log'),
          }
          with open('.github/validation/tamy-developer-hub.json', 'w', encoding='utf-8') as handle:
              json.dump(payload, handle, indent=2)
              handle.write('\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/validation/tamy-developer-hub.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Tamy Developer Hub validation'
            git push
          fi

      - name: Fail when validation failed
        if: steps.compile.outcome != 'success' || steps.tests.outcome != 'success'
        run: exit 1
