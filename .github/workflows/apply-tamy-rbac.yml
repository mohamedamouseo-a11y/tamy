name: Apply Tamy RBAC

on:
  push:
    paths:
      - '.github/workflows/apply-tamy-rbac.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tamy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply RBAC patch
        run: python3 .github/scripts/apply_tamy_rbac.py

      - name: Run focused tests
        run: python3 -m unittest tests.test_tamy_users -v

      - name: Commit RBAC changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helpers api webui tests
          if git diff --cached --quiet; then
            echo "Tamy RBAC is already applied."
            exit 0
          fi
          git commit -m "Add Tamy superadmin and user roles"
          git push origin HEAD:main
